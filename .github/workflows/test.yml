# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1-5" # every weekday at 13:00 UTC
  pull_request:
    paths-ignore:
      - "README.md"

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.4.*
          terraform_wrapper: false
      - run: go generate ./...
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)

  # Run acceptance tests in a matrix with Terraform CLI versions
  test:
    name: Acc Tests (TF ${{ matrix.terraform }}, ${{ contains(matrix.docker-image, 'unleash-enterprise') && 'enterprise' || 'oss' }}, Unleash ${{ endsWith(matrix.docker-image, ':latest') && 'latest' || endsWith(matrix.docker-image, ':6') && '6' || '5' }}${{ matrix.unleash-plan && format(', plan={0}', matrix.unleash-plan) || '' }})
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # list whatever Terraform versions here you would like to support
        terraform:
          - "1.0.*"
          - "1.1.*"
          - "1.2.*"
          - "1.3.*"
          - "1.4.*"
        docker-image:
          - "unleashorg/unleash-server:5"
          - "unleashorg/unleash-enterprise:6"
          - "unleashorg/unleash-server:6"
          - "unleashorg/unleash-enterprise:latest"
          - "unleashorg/unleash-server:latest"
        unleash-plan:
          - ""
        include:
          - terraform: "1.4.*"
            docker-image: "unleashorg/unleash-enterprise:latest"
            unleash-plan: "pro"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      - name: Start ${{ matrix.docker-image }} instance
        run: docker compose up -d --wait -t 90
        env:
          UNLEASH_DOCKER_IMAGE: ${{ matrix.docker-image }}
          UNLEASH_DEV_LICENSE: ${{ secrets.UNLEASH_DEV_LICENSE }}
      - name: Define default environment for old versions compatibility
        run: echo "DEFAULT_ENVIRONMENT=default" >> $GITHUB_ENV
        if: endsWith(matrix.docker-image, ':5') || endsWith(matrix.docker-image, ':6')
      - run: go test -v -cover ./internal/provider/
        env:
          TF_ACC: "1"
          #TF_LOG: "debug"
          UNLEASH_ENTERPRISE: "${{ contains(matrix.docker-image, 'unleash-enterprise') }}"
          UNLEASH_PLAN: ${{ matrix.unleash-plan }}
        timeout-minutes: 3
